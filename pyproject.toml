[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vine-matrix-completion"
version = "0.2.0"
description = "Correlation matrix completion with partial correlation vines and a Codex workflow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Tim Harrison"}, {name = "Paul Hewson"}, {name = "Xinbin Xu"}]
dependencies = ["numpy>=1.24", "networkx>=3.2"]

[project.urls]
Repository = "https://github.com/Xinbin1011/vine-matrix-completion"
Demonstration = "https://xinbin1011.github.io/vine-matrix-completion/"

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
vine-complete = "vine_completion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
