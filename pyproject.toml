[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vine-matrix-completion"
version = "0.1.0"
description = "Correlation matrix completion with partial correlation vines and a Codex workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Xinbin (Max) Xu"}]
dependencies = ["numpy>=1.24", "networkx>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
vine-complete = "vine_completion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
